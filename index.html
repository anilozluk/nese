<title>Neşe'nin Bulmacası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow column — greeting, sticky clue bar, the grid, secret word strip, clue lists */
:root{
  --bg:#f6f4f7; --paper:#ffffff; --ink:#221a26; --muted:#6f6475; --line:#2a2130;
  --accent:#c2185b; --accent-soft:#f8dbe7; --ok:#2e7d5b; --ok-soft:#dcefe5; --sel:#ffe9a8; --word:#fbf3d6;
  --display:"Young Serif", Georgia, serif; --body:"Figtree", system-ui, sans-serif; --mono:"IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17121a; --paper:#221b26; --ink:#f3ecf5; --muted:#a99cb0; --line:#8e7f96;
  --accent:#f06292; --accent-soft:#4a2033; --ok:#7fd1a8; --ok-soft:#1d3a2c; --sel:#6b5418; --word:#3a321c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17121a; --paper:#221b26; --ink:#f3ecf5; --muted:#a99cb0; --line:#8e7f96;
  --accent:#f06292; --accent-soft:#4a2033; --ok:#7fd1a8; --ok-soft:#1d3a2c; --sel:#6b5418; --word:#3a321c; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:24px 64px;display:flex;flex-direction:column;gap:20px}
header h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,8vw,2.6rem);line-height:1.1;margin:0;text-wrap:balance}
header h1 em{color:var(--accent);font-style:normal}
header p{margin:8px 0 0;color:var(--muted);max-width:60ch}
.cluebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:#fff;border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:baseline;min-height:48px}
.cluebar b{font-family:var(--mono);font-size:.85rem;white-space:nowrap;opacity:.9}
.cluebar span{min-width:0}
.board{overflow-x:auto}
.grid{display:grid;gap:0;margin:0 auto;width:100%;max-width:520px}
.cell{position:relative;aspect-ratio:1;max-width:100%}
.cell.on{background:var(--paper);outline:1.5px solid var(--line);outline-offset:-0.75px}
.cell input{all:unset;box-sizing:border-box;width:100%;height:100%;text-align:center;font-family:var(--mono);font-weight:600;font-size:clamp(.8rem,4.2vw,1.25rem);text-transform:uppercase;caret-color:transparent;cursor:pointer;color:var(--ink)}
.cell.inword{background:var(--word)}
.cell.active{background:var(--sel)}
.cell.ok input{color:var(--ok)}
.cell.ok:not(.active):not(.inword){background:var(--ok-soft)}
.num{position:absolute;top:1px;left:2px;font-size:clamp(.45rem,1.9vw,.62rem);font-family:var(--mono);color:var(--muted);pointer-events:none;line-height:1}
.mark::after{content:"";position:absolute;inset:12%;border:2px solid var(--accent);border-radius:50%;pointer-events:none}
.mk{position:absolute;bottom:1px;right:2px;font-size:clamp(.45rem,1.9vw,.62rem);font-family:var(--mono);color:var(--accent);font-weight:600;pointer-events:none;line-height:1}
.tools{display:flex;gap:10px;flex-wrap:wrap}
button{font:600 .95rem var(--body);border-radius:999px;padding:10px 16px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.secret{background:var(--paper);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;border:1.5px dashed var(--accent)}
.secret h2{margin:0;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{width:34px;height:40px;border-bottom:2px solid var(--accent);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:1.2rem;position:relative}
.slot small{position:absolute;top:-2px;left:2px;font-size:.55rem;color:var(--muted)}
.clues{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:480px){.clues{grid-template-columns:1fr}}
.clues h3{font-family:var(--display);font-weight:400;font-size:1.2rem;margin:0 0 6px}
.clues ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.clues li{padding:6px 8px;border-radius:8px;cursor:pointer;display:flex;gap:8px}
.clues li b{font-family:var(--mono);font-size:.85rem;min-width:1.6em;color:var(--muted)}
.clues li.cur{background:var(--word)}
.clues li.done{color:var(--ok)}
.clues li.done span{text-decoration:line-through;text-decoration-thickness:1px}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);display:grid;place-items:center;padding:24px 16px;z-index:20}
.card{background:var(--paper);border-radius:18px;padding:28px 22px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;border:2px solid var(--accent)}
.card .word{font-family:var(--mono);font-weight:600;font-size:clamp(1.6rem,9vw,2.4rem);letter-spacing:.12em;color:var(--accent)}
.card h2{font-family:var(--display);font-weight:400;margin:0;font-size:1.6rem}
.card p{margin:0;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.card{animation:pop .5s cubic-bezier(.2,.9,.3,1.3)}@keyframes pop{from{transform:scale(.85);opacity:.4}}}
</style>
<div class="wrap">
  <header>
    <h1>Bu sana, <em>Neşe</em>.</h1>
    <p>Bulmacayı çöz. Daire içindeki harfler sırayla gizli bir kelime oluşturuyor. O kelime seni bir sonraki adıma götürecek.</p>
  </header>
  <div class="cluebar" id="cluebar"><b id="cbNum"></b><span id="cbText"></span></div>
  <div class="board"><div class="grid" id="grid"></div></div>
  <div class="tools">
    <button id="hint" type="button">Bir harf aç</button>
    <button id="check" type="button">Kontrol et</button>
  </div>
  <section class="secret">
    <h2>Gizli kelime</h2>
    <div class="slots" id="slots"></div>
  </section>
  <section class="clues">
    <div><h3>Soldan sağa</h3><ol id="listA"></ol></div>
    <div><h3>Yukarıdan aşağı</h3><ol id="listD"></ol></div>
  </section>
</div>
<div class="overlay" id="win" hidden>
  <div class="card">
    <h2>Buldun!</h2>
    <div class="word" id="winWord"></div>
    <p>En ortak yanımız. Bir sonraki ipucu onda.</p>
    <p><b>Şimdi ona ulaş.</b></p>
    <button class="primary" id="closeWin" type="button">Bulmacaya dön</button>
  </div>
</div>
<script>
(function(){
const raw = atob("fSJOQUNFUk1FQyIgOiJ0ZXJjZXMiICxdXTUgLDBbICxdMSAsMVsgLF02ICw0WyAsXTggLDhbICxdNiAsMDFbICxdMTEgLDAxWyAsXTEgLDdbICxdMiAsM1tbIDoic2tyYW0iICxdfSJOQUNSRU0iIDoiYSIgLCJrbmVyIHJpYiBhZG5hbWF6ILHEbnlhICyxxGxuYWMgbmFydWsgZmlzZXIgZWR6aW5lRCIgOiJldWxjIiAsNiA6Im5lbCIgLDExIDoiYyIgLDAxIDoiciIgLCJEIiA6ImQiICwwMSA6Im4ieyAsfSJMnMNMWUWHw5zDIiA6ImEiICwiKWtpn8VpdGliICx5YSBldiBuvMNnKCA/a7HEdJ/FscRuYXQgbmFtYXogZU4iIDoiZXVsYyIgLDcgOiJuZWwiICw4IDoiYyIgLDYgOiJyIiAsIkQiIDoiZCIgLDcgOiJuInsgLH0iUrDEWUFaRUMiIDoiYSIgLCJyscSfxWF0ILHEZGEgscRueWEgZWQgaXRuZWufxWFiIDtpc2VrbLzDIGu8w3m8w2IgbmUgvMNtvMOnw2y2w3q8w3kgbrHEbidha2lyZkEiIDoiZXVsYyIgLDcgOiJuZWwiICw2IDoiYyIgLDQgOiJyIiAsIkQiIDoiZCIgLDUgOiJuInsgLH0iRUxFTFVLVSIgOiJhIiAsIm6xxG5hbbzDcnRzbmUgaXJvdmFGIiA6ImV1bGMiICw3IDoibmVsIiAsMyA6ImMiICwxIDoiciIgLCJEIiA6ImQiICwzIDoibiJ7ICx9IkFTsMROIiA6ImEiICwibGV0byB6aW1pn8RpZHZlcyBuRSIgOiJldWxjIiAsNCA6Im5lbCIgLDUgOiJjIiAsMCA6InIiICwiRCIgOiJkIiAsMSA6Im4ieyAsfSKcw0xUnMNTIiA6ImEiICwiaWunw2kgbmmfxGlkdmVzIG5FIiA6ImV1bGMiICw1IDoibmVsIiAsNSA6ImMiICwyMSA6InIiICwiQSIgOiJkIiAsMTEgOiJuInsgLH0iTU9PTEJSRU5OsMQiIDoiYSIgLCKxxGtyYZ/FIG1pn8RpZHZlcyBuZSBtaW5lQiIgOiJldWxjIiAsMDEgOiJuZWwiICwyIDoiYyIgLDAxIDoiciIgLCJBIiA6ImQiICw5IDoibiJ7ICx9IkWHw0hBQlJFTkVGIiA6ImEiICwiP26xxHOxxGxtscRrYXQgaWduYWggbmVTIiA6ImV1bGMiICwwMSA6Im5lbCIgLDAgOiJjIiAsNyA6InIiICwiQSIgOiJkIiAsOCA6Im4ieyAsfSJLRVJZRVMiIDoiYSIgLCI/ZWRlcmVuIHppbWl2ZSBpbmVZIiA6ImV1bGMiICw2IDoibmVsIiAsMiA6ImMiICw1IDoiciIgLCJBIiA6ImQiICw2IDoibiJ7ICx9IkFNVUMiIDoiYSIgLCK8w268w2cgn8VpIG5vcyBpa2VjbrbDIG5hZG51bm9zIGF0ZmFIIiA6ImV1bGMiICw0IDoibmVsIiAsMiA6ImMiICwzIDoiciIgLCJBIiA6ImQiICw0IDoibiJ7ICx9IrDEh8OwxIfDVVZBIiA6ImEiICwiKWtpn8VpdGliKCBuaXJleSBpc2VsvMNwtsMgbkUiIDoiZXVsYyIgLDcgOiJuZWwiICwxIDoiYyIgLDEgOiJyIiAsIkEiIDoiZCIgLDIgOiJuIntbIDoic2Ryb3ciICwyMSA6InciICw2MSA6Imgiew==");
const bytes = Uint8Array.from(raw, c=>c.charCodeAt(0)).reverse();
const P = JSON.parse(new TextDecoder().decode(bytes));
const up = s => s.toLocaleUpperCase('tr-TR');
const fold = s => s.replace(/İ/g,'I');
const grid = document.getElementById('grid');
grid.style.gridTemplateColumns = `repeat(${P.w},1fr)`;
const cells = {}; const key=(r,c)=>r+','+c;
P.words.forEach((w,i)=>{
  w.cells=[];
  for(let k=0;k<w.len;k++){
    const r=w.r+(w.d==='D'?k:0), c=w.c+(w.d==='A'?k:0);
    const id=key(r,c);
    if(!cells[id]) cells[id]={r,c,ans:w.a[k],w:{}};
    cells[id].w[w.d]=i; w.cells.push(id);
  }
});
let saved={}; try{saved=JSON.parse(localStorage.getItem('nese-bulmaca')||'{}')}catch(e){}
const starts={}; P.words.forEach(w=>starts[key(w.r,w.c)]=w.n);
const markIdx={}; P.marks.forEach((m,i)=>markIdx[key(m[0],m[1])]=i+1);
for(let r=0;r<P.h;r++)for(let c=0;c<P.w;c++){
  const id=key(r,c), d=document.createElement('div'); d.className='cell';
  if(cells[id]){
    d.classList.add('on'); if(markIdx[id]) d.classList.add('mark');
    const inp=document.createElement('input'); inp.id='c'+r+'_'+c; inp.setAttribute('autocomplete','off');inp.setAttribute('autocapitalize','characters');inp.setAttribute('spellcheck','false');inp.setAttribute('aria-label','Kare');
    inp.value=saved[id]||'';
    d.appendChild(inp);
    if(starts[id]){const n=document.createElement('span');n.className='num';n.textContent=starts[id];d.appendChild(n)}
    if(markIdx[id]){const n=document.createElement('span');n.className='mk';n.textContent=markIdx[id];d.appendChild(n)}
    cells[id].el=d; cells[id].inp=inp;
    inp.addEventListener('focus',()=>select(id,false));
    inp.addEventListener('mousedown',e=>{if(active===id){e.preventDefault();select(id,true)}});
    inp.addEventListener('input',()=>{
      const v=up(inp.value).replace(/[^A-ZÇĞIİÖŞÜ]/g,'');
      inp.value=v.slice(-1); store(); refresh();
      if(inp.value) move(1);
    });
    inp.addEventListener('keydown',e=>{
      if(e.key==='Backspace'&&!inp.value){e.preventDefault();move(-1,true)}
      else if(e.key==='ArrowRight'){e.preventDefault();step(0,1)}
      else if(e.key==='ArrowLeft'){e.preventDefault();step(0,-1)}
      else if(e.key==='ArrowDown'){e.preventDefault();step(1,0)}
      else if(e.key==='ArrowUp'){e.preventDefault();step(-1,0)}
    });
  }
  grid.appendChild(d);
}
['A','D'].forEach(d=>{
  const ol=document.getElementById('list'+d);
  P.words.forEach((w,i)=>{ if(w.d!==d)return;
    const li=document.createElement('li'); li.innerHTML=`<b>${w.n}</b><span>${w.clue} (${w.len})</span>`;
    li.addEventListener('click',()=>{dir=d;active=null;focusCell(w.cells.find(id=>!cells[id].inp.value)||w.cells[0])});
    w.li=li; ol.appendChild(li);
  });
});
const slots=document.getElementById('slots');
P.marks.forEach((m,i)=>{const s=document.createElement('div');s.className='slot';s.innerHTML=`<small>${i+1}</small><span></span>`;slots.appendChild(s)});
let active=null, dir='A';
function curWord(){return active?cells[active].w[dir]:null}
function select(id,toggle){
  const c=cells[id];
  if(toggle&&c.w.A!==undefined&&c.w.D!==undefined) dir=dir==='A'?'D':'A';
  else if(c.w[dir]===undefined) dir=dir==='A'?'D':'A';
  active=id; refresh();
}
function focusCell(id){cells[id].inp.focus({preventScroll:false});select(id,false)}
function move(delta,clear){
  const w=P.words[curWord()]; if(!w)return;
  const i=w.cells.indexOf(active)+delta;
  if(i>=0&&i<w.cells.length){const id=w.cells[i]; if(clear){cells[id].inp.value='';store();} focusCell(id); refresh()}
}
function step(dr,dc){const c=cells[active];const id=key(c.r+dr,c.c+dc);if(cells[id]){dir=dr?'D':'A';focusCell(id)}}
function store(){const o={};for(const id in cells)if(cells[id].inp.value)o[id]=cells[id].inp.value;try{localStorage.setItem('nese-bulmaca',JSON.stringify(o))}catch(e){}}
const isOk=w=>w.cells.every(id=>fold(cells[id].inp.value)===fold(cells[id].ans));
let won=false;
function refresh(){
  const cw=curWord();
  for(const id in cells){const c=cells[id];c.el.classList.toggle('active',id===active);c.el.classList.toggle('inword',cw!=null&&c.w[dir]===cw&&id!==active);c.el.classList.remove('ok')}
  let all=true;
  P.words.forEach((w,i)=>{const ok=isOk(w);if(!ok)all=false;w.li.classList.toggle('done',ok);w.li.classList.toggle('cur',i===cw);if(ok)w.cells.forEach(id=>cells[id].el.classList.add('ok'))});
  const w=P.words[cw];
  document.getElementById('cbNum').textContent=w?`${w.n} ${w.d==='A'?'→':'↓'}`:'';
  document.getElementById('cbText').textContent=w?`${w.clue} (${w.len})`:'Başlamak için bir kareye dokun.';
  [...slots.children].forEach((s,i)=>{const m=P.marks[i];s.querySelector('span').textContent=cells[key(m[0],m[1])].inp.value||''});
  if(all&&!won){won=true;document.getElementById('winWord').textContent=P.secret;document.getElementById('win').hidden=false}
}
document.getElementById('hint').addEventListener('click',()=>{
  let w=P.words[curWord()]; if(!w) w=P.words.find(x=>!isOk(x)); if(!w)return;
  const id=w.cells.find(id=>fold(cells[id].inp.value)!==fold(cells[id].ans)); if(!id)return;
  cells[id].inp.value=cells[id].ans; store(); dir=w.d; focusCell(id); refresh();
});
document.getElementById('check').addEventListener('click',()=>{
  for(const id in cells){const c=cells[id];if(c.inp.value&&fold(c.inp.value)!==fold(c.ans)){c.inp.style.color='var(--accent)';setTimeout(()=>c.inp.style.color='',1500)}}
});
document.getElementById('closeWin').addEventListener('click',()=>{document.getElementById('win').hidden=true});
refresh();
})();
</script>
