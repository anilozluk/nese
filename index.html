<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Neşe'nin Bulmacası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Young+Serif&display=swap">
<style>
:root{
  --bg:#f6f4f7; --paper:#ffffff; --ink:#221a26; --muted:#6f6475; --line:#2a2130;
  --accent:#c2185b; --ok:#2e7d5b; --ok-soft:#dcefe5; --sel:#ffe08a; --word:#fbf1cf;
  --body:"Figtree",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace; --display:"Young Serif",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#17121a; --paper:#241d28; --ink:#f3ecf5; --muted:#a99cb0; --line:#9a8aa3;
  --accent:#f06292; --ok:#7fd1a8; --ok-soft:#1d3a2c; --sel:#7a6118; --word:#3a321c; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 12px calc(env(safe-area-inset-bottom,0px) + 14px);
  --size:min(calc(100vw - 24px), calc(100dvh - 210px), 560px)}
.bar{width:var(--size);display:flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border-radius:12px;padding:6px;min-height:56px}
.bar button{flex:none;width:36px;height:40px;border:0;border-radius:8px;background:rgba(255,255,255,.18);color:#fff;font:600 1.2rem var(--body);cursor:pointer}
.clue{flex:1;min-width:0;font-size:.95rem;line-height:1.3;padding-inline:4px}
.clue b{font-family:var(--mono);font-size:.8rem;opacity:.85;margin-right:6px}
.grid{width:var(--size);height:var(--size);display:grid;flex:none}
.cell{position:relative;min-width:0}
.cell.on{background:var(--paper);box-shadow:inset 0 0 0 .75px var(--line);border:.75px solid var(--line)}
.cell input{all:unset;box-sizing:border-box;width:100%;height:100%;text-align:center;font-family:var(--mono);font-weight:600;font-size:calc(var(--size) / 12 * .52);text-transform:uppercase;caret-color:transparent;color:var(--ink);cursor:pointer}
.cell.inword{background:var(--word)}
.cell.active{background:var(--sel)}
.cell.ok input{color:var(--ok)}
.cell.ok:not(.active):not(.inword){background:var(--ok-soft)}
.cell.bad input{color:var(--accent)}
.num{position:absolute;top:1px;left:2px;font:500 calc(var(--size) / 12 * .24)/1 var(--mono);color:var(--muted);pointer-events:none}
.mark::after{content:"";position:absolute;inset:10%;border:2px solid var(--accent);border-radius:50%;pointer-events:none}
.bottom{width:var(--size);display:flex;align-items:center;justify-content:space-between;gap:10px}
.slots{display:flex;gap:4px}
.slot{width:24px;height:30px;border-bottom:2px solid var(--accent);display:grid;place-items:center;font:600 1rem var(--mono);color:var(--accent)}
.hint{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 .85rem var(--body);cursor:pointer;flex:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.overlay{position:fixed;inset:0;background:rgba(20,12,24,.55);display:grid;place-items:center;padding:24px 16px;z-index:20}
.card{background:var(--paper);border-radius:18px;padding:28px 22px;max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;border:2px solid var(--accent)}
.card h2{font-family:var(--display);font-weight:400;margin:0;font-size:1.7rem}
.card .word{font:600 clamp(1.6rem,9vw,2.3rem) var(--mono);letter-spacing:.12em;color:var(--accent)}
.card p{margin:0}
.card button{margin-top:6px;border:0;border-radius:999px;padding:12px;background:var(--accent);color:#fff;font:600 1rem var(--body);cursor:pointer}
@media (prefers-reduced-motion:no-preference){.card{animation:pop .5s cubic-bezier(.2,.9,.3,1.3)}@keyframes pop{from{transform:scale(.85);opacity:.4}}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button id="prev" type="button" aria-label="Önceki soru">‹</button>
    <div class="clue" id="clue"></div>
    <button id="next" type="button" aria-label="Sonraki soru">›</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="bottom">
    <div class="slots" id="slots"></div>
    <button class="hint" id="hint" type="button">Harf aç</button>
  </div>
</div>
<div class="overlay" id="win" hidden>
  <div class="card">
    <h2>Buldun!</h2>
    <div class="word" id="winWord"></div>
    <p>En ortak yanımız. Bir sonraki ipucu onda.</p>
    <p><b>Şimdi ona ulaş.</b></p>
    <button id="closeWin" type="button">Tamam</button>
  </div>
</div>
<script>
(function(){
const raw=atob("fSJOQUNFUk1FQyIgOiJ0ZXJjZXMiICxdXTggLDExWyAsXTYgLDNbICxdNyAsOFsgLF05ICw5WyAsXTQgLDVbICxdMyAsMTFbICxdMTEgLDZbICxdNSAsMFtbIDoic2tyYW0iICxdfSJBTVVDIiA6ImEiICwivMNuvMNnIJ/FaSBub3MgaWtlY262wyBuYWRudW5vcyBhdGZhSCIgOiJldWxjIiAsNCA6Im5lbCIgLDcgOiJjIiAsOCA6InIiICwiRCIgOiJkIiAsOSA6Im4ieyAsfSJLRVJZRVMiIDoiYSIgLCI/ZWRlcmVuIHppbWl2ZSBpbmVZIiA6ImV1bGMiICw2IDoibmVsIiAsMTEgOiJjIiAsNSA6InIiICwiRCIgOiJkIiAsNyA6Im4ieyAsfSJMnMNMWUWHw5zDIiA6ImEiICwiKWtpn8VpdGliICx5YSBldiBuvMNnKCA/a7HEdJ/FscRuYXQgbmFtYXogZU4iIDoiZXVsYyIgLDcgOiJuZWwiICwxIDoiYyIgLDMgOiJyIiAsIkQiIDoiZCIgLDQgOiJuInsgLH0iTU9PTEJSRU5OsMQiIDoiYSIgLCKxxGtyYZ/FIG1pn8RpZHZlcyBuZSBtaW5lQiIgOiJldWxjIiAsMDEgOiJuZWwiICwzIDoiYyIgLDIgOiJyIiAsIkQiIDoiZCIgLDMgOiJuInsgLH0isMSHw7DEh8NVVkEiIDoiYSIgLCIpa2mfxWl0aWIoIG5pcmV5IGlzZWy8w3C2wyBuRSIgOiJldWxjIiAsNyA6Im5lbCIgLDggOiJjIiAsMCA6InIiICwiRCIgOiJkIiAsMiA6Im4ieyAsfSJOQUNSRU0iIDoiYSIgLCJrbmVyIHJpYiBhZG5hbWF6ILHEbnlhICyxxGxuYWMgbmFydWsgZmlzZXIgZWR6aW5lRCIgOiJldWxjIiAsNiA6Im5lbCIgLDMgOiJjIiAsMTEgOiJyIiAsIkEiIDoiZCIgLDExIDoibiJ7ICx9IkVMRUxVS1UiIDoiYSIgLCJuscRuYW28w3J0c25lIGlyb3ZhRiIgOiJldWxjIiAsNyA6Im5lbCIgLDUgOiJjIiAsOSA6InIiICwiQSIgOiJkIiAsMDEgOiJuInsgLH0inMNMVJzDUyIgOiJhIiAsImlrp8NpIG5pn8RpZHZlcyBuRSIgOiJldWxjIiAsNSA6Im5lbCIgLDAgOiJjIiAsOCA6InIiICwiQSIgOiJkIiAsOCA6Im4ieyAsfSJFh8NIQUJSRU5FRiIgOiJhIiAsIj9uscRzscRsbbHEa2F0IGlnbmFoIG5lUyIgOiJldWxjIiAsMDEgOiJuZWwiICwwIDoiYyIgLDUgOiJyIiAsIkEiIDoiZCIgLDYgOiJuInsgLH0iQVOwxE4iIDoiYSIgLCJsZXRvIHppbWmfxGlkdmVzIG5FIiA6ImV1bGMiICw0IDoibmVsIiAsMyA6ImMiICwzIDoiciIgLCJBIiA6ImQiICw1IDoibiJ7ICx9IlKwxFlBWkVDIiA6ImEiICwiaXNla2y8wyBrvMN5vMNiIG5lILzDbbzDp8NstsN6vMN5IG6xxG4nYWtpcmZBIiA6ImV1bGMiICw3IDoibmVsIiAsNSA6ImMiICwwIDoiciIgLCJBIiA6ImQiICwxIDoibiJ7WyA6InNkcm93IiAsMjEgOiJ3IiAsMjEgOiJoIns=");
const P=JSON.parse(new TextDecoder().decode(Uint8Array.from(raw,c=>c.charCodeAt(0)).reverse()));
const up=s=>s.toLocaleUpperCase('tr-TR'), fold=s=>s.replace(/İ/g,'I');
const grid=document.getElementById('grid');
grid.style.gridTemplateColumns=`repeat(${P.w},1fr)`; grid.style.gridTemplateRows=`repeat(${P.h},1fr)`;
const key=(r,c)=>r+','+c, cells={};
P.words.forEach((w,i)=>{w.cells=[];for(let k=0;k<w.len;k++){const r=w.r+(w.d==='D'?k:0),c=w.c+(w.d==='A'?k:0),id=key(r,c);
  if(!cells[id])cells[id]={r,c,ans:w.a[k],w:{}};cells[id].w[w.d]=i;w.cells.push(id)}});
let saved={};try{saved=JSON.parse(localStorage.getItem('nese-bulmaca-v2')||'{}')}catch(e){}
const starts={};P.words.forEach(w=>starts[key(w.r,w.c)]=w.n);
const marked=new Set(P.marks.map(m=>key(m[0],m[1])));
let active=null,dir='A',won=false;
for(let r=0;r<P.h;r++)for(let c=0;c<P.w;c++){
  const id=key(r,c),d=document.createElement('div');d.className='cell';
  if(cells[id]){
    d.classList.add('on');if(marked.has(id))d.classList.add('mark');
    const inp=document.createElement('input');inp.id='c'+r+'_'+c;
    ['autocomplete','off','autocapitalize','characters','spellcheck','false','autocorrect','off','aria-label','Kare'].forEach((v,i,a)=>{if(i%2===0)inp.setAttribute(v,a[i+1])});
    inp.value=saved[id]||'';d.appendChild(inp);
    if(starts[id]){const n=document.createElement('span');n.className='num';n.textContent=starts[id];d.appendChild(n)}
    cells[id].el=d;cells[id].inp=inp;
    inp.addEventListener('pointerdown',e=>{if(active===id){e.preventDefault();toggle()}});
    inp.addEventListener('focus',()=>{if(active!==id)select(id)});
    inp.addEventListener('input',()=>{const v=up(inp.value).replace(/[^A-ZÇĞIİÖŞÜ]/g,'');inp.value=v.slice(-1);store();refresh();if(inp.value)move(1)});
    inp.addEventListener('keydown',e=>{
      if(e.key==='Backspace'&&!inp.value){e.preventDefault();move(-1,true)}
      else if(e.key.startsWith('Arrow')){e.preventDefault();const m={ArrowRight:[0,1],ArrowLeft:[0,-1],ArrowDown:[1,0],ArrowUp:[-1,0]}[e.key];const t=key(cells[active].r+m[0],cells[active].c+m[1]);if(cells[t]){dir=m[0]?'D':'A';go(t)}}
    });
  }
  grid.appendChild(d);
}
const slots=document.getElementById('slots');
P.marks.forEach(()=>{const s=document.createElement('div');s.className='slot';slots.appendChild(s)});
const cur=()=>active?cells[active].w[dir]:null;
function select(id){const c=cells[id];if(c.w[dir]===undefined)dir=dir==='A'?'D':'A';active=id;refresh()}
function toggle(){const c=cells[active];if(c.w.A!==undefined&&c.w.D!==undefined){dir=dir==='A'?'D':'A';refresh()}}
function go(id){active=id;cells[id].inp.focus({preventScroll:true});select(id)}
function move(delta,clear){const w=P.words[cur()];if(!w)return;const i=w.cells.indexOf(active)+delta;if(i<0||i>=w.cells.length)return;const id=w.cells[i];if(clear){cells[id].inp.value='';store()}go(id)}
function goWord(i){const w=P.words[(i+P.words.length)%P.words.length];dir=w.d;go(w.cells.find(id=>!cells[id].inp.value)||w.cells[0])}
function store(){const o={};for(const id in cells)if(cells[id].inp.value)o[id]=cells[id].inp.value;try{localStorage.setItem('nese-bulmaca-v2',JSON.stringify(o))}catch(e){}}
const isOk=w=>w.cells.every(id=>cells[id].inp.value&&fold(cells[id].inp.value)===fold(cells[id].ans));
function refresh(){
  const cw=cur();
  for(const id in cells){const c=cells[id];c.el.classList.toggle('active',id===active);c.el.classList.toggle('inword',cw!==null&&c.w[dir]===cw&&id!==active);c.el.classList.remove('ok')}
  let all=true;P.words.forEach(w=>{if(isOk(w))w.cells.forEach(id=>cells[id].el.classList.add('ok'));else all=false});
  const w=P.words[cw];
  document.getElementById('clue').innerHTML=w?`<b>${w.n}${w.d==='A'?'→':'↓'}</b>${w.clue} (${w.len})`:'Başlamak için bir kareye dokun. Daire içindeki harfler gizli kelimeyi oluşturur.';
  [...slots.children].forEach((s,i)=>{s.textContent=cells[key(...P.marks[i])].inp.value||''});
  if(all&&!won){won=true;document.activeElement&&document.activeElement.blur();document.getElementById('winWord').textContent=P.secret;document.getElementById('win').hidden=false}
}
document.getElementById('prev').addEventListener('click',()=>goWord((cur()??0)-1));
document.getElementById('next').addEventListener('click',()=>goWord(cur()===null?0:cur()+1));
document.getElementById('hint').addEventListener('click',()=>{
  let w=P.words[cur()];if(!w||isOk(w))w=P.words.find(x=>!isOk(x));if(!w)return;
  const id=w.cells.find(id=>fold(cells[id].inp.value)!==fold(cells[id].ans));cells[id].inp.value=cells[id].ans;store();dir=w.d;go(id);refresh();
});
document.getElementById('closeWin').addEventListener('click',()=>{document.getElementById('win').hidden=true});
refresh();
})();
</script>
</body>
</html>
